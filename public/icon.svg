<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Rounded rect background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Radar circles -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.12" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.18" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.30" />
  <line x1="256" y1="256" x2="430" y2="135" stroke="#38bdf8" stroke-width="5" stroke-opacity="0.35" stroke-linecap="round" />

  <!-- Briefcase Silhouette -->
  <!-- Handle -->
  <path d="M 200 205 V 155 C 200 138 214 125 232 125 H 280 C 298 125 312 138 312 155 V 205" 
        fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Briefcase Body -->
  <rect x="108" y="205" width="296" height="225" rx="32" fill="#0a132c" stroke="#ffffff" stroke-width="12" filter="url(#shadow)" />

  <!-- Modern FR text -->
  <!-- F -->
  <path d="M 168 255 V 380 M 168 255 H 230 M 168 312 H 215" 
        stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- R -->
  <path d="M 260 255 V 380 M 260 255 H 304 C 322 255 334 266 334 284 C 334 302 322 314 304 314 H 260 M 296 314 L 332 380" 
        stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Verification Checkmark Badge -->
  <circle cx="390" cy="205" r="48" fill="#10b981" stroke="#ffffff" stroke-width="8" filter="url(#shadow)" />
  <path d="M 368 205 L 384 221 L 414 189" 
        stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
